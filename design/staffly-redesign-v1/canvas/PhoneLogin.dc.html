<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Staffly phone PIN login</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#d4d4d4}a:hover{color:#ffffff}
@keyframes driftUp{from{transform:translate3d(0,0,0)}to{transform:translate3d(-60px,-520px,0)}}
@keyframes reveal{from{opacity:0;filter:blur(10px);transform:translateY(14px)}to{opacity:1;filter:blur(0);transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
@keyframes glowmove{0%,100%{transform:translate(-8%,-4%)}50%{transform:translate(10%,8%)}}
.plane{animation:driftUp 40s ease-in-out infinite alternate}
.w{display:inline-block;opacity:0;animation:reveal .8s cubic-bezier(.16,1,.3,1) both}
.rise{animation:rise .8s cubic-bezier(.16,1,.3,1) both}
.pop{animation:pop .35s cubic-bezier(.16,1,.3,1) both}
.glow{animation:glowmove 16s ease-in-out infinite}
.key{transition:background .12s,transform .12s}
.key:hover{background:rgba(255,255,255,0.12)}
.key:active{transform:scale(.94);background:rgba(255,255,255,0.18)}
@media (prefers-reduced-motion:reduce){.plane,.w,.rise,.pop,.glow{animation:none!important;opacity:1;filter:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #050505; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #fafafa">
  <div aria-hidden="true" style="position: absolute; inset: 0; perspective: 900px; overflow: hidden">
    <div style="position: absolute; left: -30%; top: -10%; width: 160%; height: 160%; transform: rotateX(40deg) rotateZ(-14deg)">
      <div class="plane" style="display: grid; grid-template-columns: repeat(3, 170px); gap: 14px; padding: 20px">
        <sc-for list="{{tiles}}" as="t" hint-placeholder-count="21">
          <div style="height: 92px; border-radius: 14px; padding: 12px 14px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; background: {{t.bg}}; border: 1px solid rgba(255,255,255,0.07)">
            <span style="font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: rgba(255,255,255,0.45)">{{t.kicker}}</span>
            <span style="font-family: Fraunces, serif; font-size: 19px; color: rgba(255,255,255,0.75)">{{t.main}}</span>
          </div>
        </sc-for>
      </div>
    </div>
  </div>
  <div aria-hidden="true" class="glow" style="position: absolute; width: 520px; height: 520px; left: -120px; top: -160px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,0.09), rgba(255,255,255,0) 65%)"></div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(5,5,5,0.6) 0%, rgba(5,5,5,0.25) 22%, rgba(5,5,5,0.93) 48%, #050505 62%)"></div>

  <div style="position: absolute; inset: 0; display: flex; flex-direction: column; padding: 28px 24px 26px; box-sizing: border-box">
    <div style="display: flex; align-items: center; gap: 10px">
      <svg width="28" height="28" viewBox="0 0 48 48" role="img" aria-label="DCC"><rect width="22" height="22" rx="5" fill="#fafafa"></rect><rect x="26" width="22" height="22" rx="5" fill="#fafafa"></rect><rect y="26" width="22" height="22" rx="5" fill="#fafafa"></rect><rect x="26" y="26" width="22" height="22" rx="5" fill="#fafafa"></rect><g fill="none" stroke="#0a0a0a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5L11 5l7 5.5V18H4z"></path><path d="M30 10.5L37 5l7 5.5V18H30z"></path><path d="M3.5 32.5h10v8h-10zM13.5 35.5h4l2.5 3V40.5h-6.5z"></path><path d="M30.5 30.5v12.5M30.5 43h5M32.5 34h4.5l2 4.5v3.5h-6.5z"></path></g></svg>
      <span style="font-family: Fraunces, serif; font-size: 22px; font-weight: 600">Staffly</span>
    </div>

    <div style="margin-top: 150px; display: flex; flex-direction: column; gap: 8px">
      <h1 style="margin: 0; font-family: Fraunces, serif; font-weight: 500; font-size: 34px; line-height: 1.08; letter-spacing: -0.02em">
        <span class="w" style="animation-delay: .15s">Good</span> <span class="w" style="animation-delay: .25s">morning,</span><br><span class="w" style="animation-delay: .4s; color: #a3a3a3; font-style: italic">Augustine</span>
      </h1>
      <p class="rise" style="margin: 0; font-size: 14px; color: rgba(255,255,255,0.62); animation-delay: .6s">Enter your PIN to punch in</p>
    </div>

    <div class="rise" style="margin-top: 26px; display: flex; justify-content: center; gap: 18px; animation-delay: .7s" aria-live="polite">
      <sc-for list="{{dots}}" as="d" hint-placeholder-count="4">
        <span style="width: 16px; height: 16px; border-radius: 50%; border: 2px solid {{d.ring}}; box-sizing: border-box; display: flex; align-items: center; justify-content: center">
          <sc-if value="{{d.filled}}" hint-placeholder-val="{{false}}"><span class="pop" style="width: 16px; height: 16px; border-radius: 50%; background: #fafafa"></span></sc-if>
        </span>
      </sc-for>
    </div>

    <div class="rise" style="margin-top: auto; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; animation-delay: .85s">
      <sc-for list="{{keys}}" as="k" hint-placeholder-count="12">
        <button class="key" type="button" onClick="{{k.press}}" aria-label="{{k.label}}" style="height: 62px; border-radius: 18px; border: 0; background: {{k.bg}}; color: #fafafa; font: 500 24px Fraunces, serif; cursor: pointer">{{k.text}}</button>
      </sc-for>
    </div>
    <a href="#" style="margin-top: 16px; text-align: center; font-size: 14px; font-weight: 600; text-decoration: none">Use ID &amp; password instead</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { pin: '' }; }
  renderVals() {
    const kinds = [['Okhla · In', '09:42'], ['HO · Today', '19/22'], ['Gurgaon · Out', '19:12'], ['Leave', 'Approved'], ['Month', '96.4%'], ['Selfie', 'Verified'], ['OT', '+0.4 h']];
    const bgs = ['#0f0f0f', '#121212', '#0c0c0c'];
    const tiles = Array.from({ length: 21 }, (_, i) => ({ kicker: kinds[i % 7][0], main: kinds[i % 7][1], bg: bgs[i % 3] }));
    const pin = this.state.pin;
    const add = (d) => () => this.setState({ pin: (this.state.pin + d).slice(0, 4) });
    const del = () => this.setState({ pin: this.state.pin.slice(0, -1) });
    const keys = ['1','2','3','4','5','6','7','8','9','bio','0','del'].map((k) => ({
      text: k === 'del' ? '⌫' : k === 'bio' ? '◎' : k,
      label: k === 'del' ? 'Delete' : k === 'bio' ? 'Use fingerprint' : 'Digit ' + k,
      bg: k === 'bio' || k === 'del' ? 'transparent' : 'rgba(255,255,255,0.07)',
      press: k === 'del' ? del : k === 'bio' ? () => {} : add(k)
    }));
    const dots = [0,1,2,3].map((i) => ({ filled: i < pin.length, ring: i < pin.length ? '#fafafa' : 'rgba(255,255,255,0.3)' }));
    return { tiles, keys, dots };
  }
}
</script>
</body>
</html>
