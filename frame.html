<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Staffly - Workforce Attendance Portal</title>
<meta name="theme-color" content="#050505">
<script src="/dash/js/theme.js?v=66"></script>
<link rel="icon" type="image/png" sizes="96x96" href="favicon-96x96.png">
<style>
  html, body { height: 100%; margin: 0; }
  body { background: var(--fbg,#f4effb); display: flex; align-items: center; justify-content: center; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
  .host { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .phone { width: 408px; height: min(860px, calc(100vh - 84px)); background: var(--fcard,#fff); border-radius: 26px; border: 1px solid var(--fline,#e4d9f4); box-shadow: 0 18px 50px rgba(43, 20, 80, .22); overflow: hidden; }
  .phone iframe { width: 100%; height: 100%; border: 0; display: block; }
  .bar { font-size: 13px; color: var(--fmut,#6f5f8d); display: flex; align-items: center; gap: 10px; }
  .bar button { border: 0; background: linear-gradient(135deg,#7c4dcc,#c46fd8); color: #fff; border-radius: 8px; padding: 7px 14px; font: inherit; font-weight: 600; cursor: pointer; }
  html[data-theme="twilight"]{--fbg:#150a26;--fcard:#24133f;--fline:#3d2a62;--fmut:#b3a1d4}
  html[data-theme="twilight"] .bar button{color:#1a0b2e;background:linear-gradient(135deg,#a678f0,#f08fd0)}
</style>
</head>
<body>
<div class="host">
  <div class="phone">
    <iframe id="f" title="Staffly" allow="geolocation; camera; microphone; clipboard-write; publickey-credentials-get; publickey-credentials-create"></iframe>
  </div>
  <div class="bar"><span>Mobile view (test)</span><button id="b" type="button">Switch to Dashboard</button></div>
</div>
<script>
(function () {
  var KEY = 'staffly_view_mode', mode = '';
  try { mode = localStorage.getItem(KEY) || ''; } catch (e) {}
  /* only stay here if Mobile view was chosen and the window is wide; otherwise go back to the normal app */
  if (mode !== 'mobile' || window.innerWidth < 769) { location.replace('./'); return; }
  document.getElementById('f').src = './index.html?m=1';
  document.getElementById('b').onclick = function () {
    try { localStorage.setItem(KEY, 'pc'); } catch (e) {}
    location.replace('./');
  };
})();
</script>
</body>
</html>
